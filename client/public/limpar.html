<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limpando...</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07111f;color:#fff;font-family:system-ui;text-align:center}a{color:#2dd4bf}</style>
</head>
<body>
<div>
  <p id="msg">Limpando cache do site...</p>
  <p><a id="link" href="/login" style="display:none">Ir para o login</a></p>
</div>
<script>
(async function() {
  try {
    localStorage.clear();
    sessionStorage.clear();
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      for (const k of keys) await caches.delete(k);
    }
    document.getElementById("msg").textContent = "Pronto. Redirecionando...";
    setTimeout(() => { window.location.replace("/login"); }, 600);
  } catch (e) {
    document.getElementById("msg").textContent = "Não consegui limpar automaticamente.";
    document.getElementById("link").style.display = "inline";
  }
})();
</script>
</body>
</html>
